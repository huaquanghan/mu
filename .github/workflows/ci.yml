name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04] # 22.04 dropped: pinned harness-cli needs glibc 2.39
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Harness fresh-clone proof
        run: |
          make harness-init
          scripts/bin/harness-cli query matrix --numeric
          scripts/bin/harness-cli audit
      - name: Unit tests
        run: go test ./... -count=1
      - name: Race tests
        run: go test ./... -race -count=1
      - name: Vet
        run: go vet ./...
      - name: Destructive package coverage
        run: make coverage
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Build
        run: make build
      - name: Smoke
        run: make smoke

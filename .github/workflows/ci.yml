name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04] # 22.04 dropped: pinned harness-cli needs glibc 2.39
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          # make build targets musl for the static release binary.
          targets: x86_64-unknown-linux-musl
      - name: Harness fresh-clone proof
        run: |
          make harness-init
          scripts/bin/harness-cli query matrix --numeric
          scripts/bin/harness-cli audit
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test
      - name: Build
        run: make build
      - name: Smoke
        run: make smoke

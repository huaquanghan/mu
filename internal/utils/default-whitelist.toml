# mu default protected paths — never touched without explicit --force
# Add your own entries under [user] section in ~/.config/mu/config.toml

[protected_paths]
system = [
  "/",
  "/boot",
  "/etc",
  "/usr",
  "/lib",
  "/lib64",
  "/bin",
  "/sbin",
  "/proc",
  "/sys",
  "/dev",
  "/run",
]

# Legacy key retained for config compatibility. APT simulated autoremove policy
# is the sole source of package removal candidates (mu does not filter by uname -r).
protect_running_kernel = true

# Cache dirs to always skip inside ~/.cache (relative paths; globs supported)
[cache_skip]
dirs = [
  # Tool / language build & package caches (high value to keep)
  "go-build",
  "go-mod",
  "pip",
  "pypoetry",
  "npm",
  "yarn",
  "pnpm",
  "typescript",
  "deno",
  "bun",
  "huggingface",
  "torch",
  "tldr",
  "mesa_shader_cache",
  "nvidia",
  "flatpak",
  "JetBrains",
  # Browser / session-sensitive (whole top-level under ~/.cache)
  "mozilla",
  "google-chrome",
  # Nested globs (also covered by top-level mozilla/google-chrome when present)
  "mozilla/firefox/*/startupCache",
  "google-chrome/Default/Session*",
]

# Optimize steps to skip (apt, journal, caches)
[optimize_skip]
steps = []
